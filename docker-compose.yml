version: "3.8" # Updated version for better feature support
services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app # Matches a standard 'WORKDIR /app'
      - /app/node_modules # Anonymous volume to protect container modules
    depends_on:
      - db
    environment:
      - MONGO_CONNECTION_STRING=mongodb://db:27017/chat-app
  
  db:
    image: mongo:latest # Use a modern version
    ports:
      - "27017:27017" # Allows you to use MongoDB Compass on your laptop to see the data
    volumes:
      - mongo-data:/data/db # Persists your chat history so it's not deleted

volumes:
  mongo-data: # Named volume for database persistence