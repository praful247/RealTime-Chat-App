name: Publish and Deploy

on:
  push:
    branches: ['main', 'master']

jobs:
  # JOB 1: Build and Push
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # This creates a tag like 'username/chat-app:latest'
          images: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # JOB 2: Secure SSH Deployment
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: push_to_registry
    steps:
      - name: Docker-safe container name
        id: slug
        shell: bash
        run: |
          raw='${{ github.event.repository.name }}'
          slug=$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\{2,\}/-/g;s/^-//;s/-$//')
          if [ -z "$slug" ]; then slug=webapp; fi
          echo "container=${slug}" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          CONTAINER_NAME: ${{ steps.slug.outputs.container }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USER,REPO_NAME,CONTAINER_NAME,MONGO_URI,PUBLIC_APP_URL
          script: |
            set -e
            docker pull "${DOCKER_USER}/${REPO_NAME}:latest"
            docker stop "${CONTAINER_NAME}" || true
            docker rm "${CONTAINER_NAME}" || true
            FE_ARGS=""
            if [ -n "$PUBLIC_APP_URL" ]; then
              FE_ARGS="-e FRONTEND_URL=${PUBLIC_APP_URL}"
            fi
            docker run -d \
              --name "${CONTAINER_NAME}" \
              -p 80:5000 \
              -e NODE_ENV=production \
              -e MONGO_URI="${MONGO_URI}" \
              -e MONGO_CONNECTION_STRING="${MONGO_URI}" \
              ${FE_ARGS} \
              --restart always \
              "${DOCKER_USER}/${REPO_NAME}:latest"
            docker image prune -f