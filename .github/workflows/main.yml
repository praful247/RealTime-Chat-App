name: Publish and Deploy

on:
  push:
    branches: ['main', 'master']

jobs:
  # JOB 1: Build and Push
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      repo_slug: ${{ steps.slug.outputs.repo_slug }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Lowercase repo name for image (safe to pass between jobs)
        id: slug
        shell: bash
        run: |
          r="${{ github.event.repository.name }}"
          s=$(printf '%s' "$r" | tr '[:upper:]' '[:lower:]')
          echo "repo_slug=${s}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ steps.slug.outputs.repo_slug }}:latest

  # JOB 2: Secure SSH Deployment
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: push_to_registry
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          REPO_SLUG: ${{ needs.push_to_registry.outputs.repo_slug }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USER,REPO_SLUG,MONGO_URI,PUBLIC_APP_URL
          script: |
            set -e
            IMAGE=$(printf '%s' "${DOCKER_USER}/${REPO_SLUG}" | tr '[:upper:]' '[:lower:]')
            if [ -z "$REPO_SLUG" ] || [ -z "$DOCKER_USER" ]; then
              echo "DOCKER_USER or REPO_SLUG is empty"; exit 1
            fi
            # derive a safe container name from the image (everything after the last /)
            CONTAINER=$(printf '%s' "$IMAGE" | sed 's|.*/||' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
            docker pull "${IMAGE}:latest"
            docker stop "${CONTAINER}" || true
            docker rm   "${CONTAINER}" || true
            FE_ARGS=""
            if [ -n "$PUBLIC_APP_URL" ]; then
              FE_ARGS="-e FRONTEND_URL=${PUBLIC_APP_URL}"
            fi
            docker run -d \
              --name "${CONTAINER}" \
              -p 80:5000 \
              -e NODE_ENV=production \
              -e MONGO_URI="${MONGO_URI}" \
              -e MONGO_CONNECTION_STRING="${MONGO_URI}" \
              ${FE_ARGS} \
              --restart always \
              "${IMAGE}:latest"
            sleep 3
            docker ps --filter "name=${CONTAINER}"
            if ! curl -sfS --max-time 15 "http://127.0.0.1/health" | grep -q ok; then
              echo "=== Health check failed on the instance (app not listening on :80). Recent logs: ==="
              docker logs "${CONTAINER}" --tail 120 2>&1 || true
              exit 1
            fi
            echo "OK: app responds on http://127.0.0.1/health"
            echo "If the browser still cannot open the site, open EC2 Security Group inbound TCP 80 (0.0.0.0/0) and use http:// (not https) unless you add TLS."
            docker image prune -f