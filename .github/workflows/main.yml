name: Publish and Deploy

on:
  push:
    branches: ['main', 'master']

jobs:
  # JOB 1: Build and Push
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # This creates a tag like 'username/chat-app:latest'
          images: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # JOB 2: Secure SSH Deployment
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: push_to_registry # FIXED: Matches the job ID above
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Pull directly using GitHub Context (No bash variables)
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            
            # 2. Stop and remove using the Repo Name context
            docker stop ${{ github.event.repository.name }} || true
            docker rm ${{ github.event.repository.name }} || true
            
            # 3. Run the new container
            docker run -d \
              --name ${{ github.event.repository.name }} \
              -p 80:3000 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest

            # 4. Cleanup
            docker image prune -f